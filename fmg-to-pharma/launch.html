<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>FMG to Pharma — Launching</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF7F2;color:#0A2540;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #E8E2D9;border-radius:20px;padding:32px;text-align:center;box-shadow:0 18px 50px rgba(10,37,64,.08)}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0 0 10px}p{color:#69717A;margin:0}.dot{width:10px;height:10px;border-radius:50%;background:#C9A84C;margin:18px auto;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.6);opacity:.5}}
  </style>
</head>
<body>
  <main class="card"><div class="dot"></div><h1>Opening the FMG Career Reality Check…</h1><p>Preparing the secure research-beta form.</p></main>
  <script>
    (async()=>{
      try{
        if(!('serviceWorker' in navigator)) throw new Error('service worker unsupported');
        const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
        await navigator.serviceWorker.ready;
        if(!navigator.serviceWorker.controller){
          await new Promise(resolve=>{
            navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true});
            setTimeout(resolve,1200);
          });
        }
        location.replace('./index.html?live=1'+location.search.replace(/^\?/, '&'));
      }catch(error){
        location.replace('./index.html'+location.search);
      }
    })();
  </script>
</body>
</html>
