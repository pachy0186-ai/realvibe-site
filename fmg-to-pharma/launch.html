<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>FMG to Pharma</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#0b2239;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.dot{width:9px;height:9px;border-radius:50%;background:#c9a34a;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.5);opacity:.45}}
  </style>
</head>
<body>
  <div class="dot" aria-label="Loading"></div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          await navigator.serviceWorker.register('./sw.js',{scope:'./'});
          await navigator.serviceWorker.ready;
        }
      }catch(e){}
      location.replace('./home.html'+location.search);
    })();
  </script>
</body>
</html>
